---
# VLE-8 Phase 2: Configure the target system for Blue-Green deployment
- name: Configure Blue-Green deployment environment
  hosts: bluegreen
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Install Java 21 (required by current Jenkins)
      apt:
        name:
          - openjdk-21-jre
          - fontconfig
        state: present

    - name: Install prerequisite packages
      apt:
        name:
          - git
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
        state: present

    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: Download current Jenkins signing key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add Jenkins apt repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      apt:
        update_cache: yes
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Download kubectl (stable release)
      get_url:
        url: https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Download minikube
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"

    - name: Verify Docker version
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify kubectl version
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Verify Jenkins is active
      command: systemctl is-active jenkins
      register: jenkins_active
      changed_when: false

    - name: Show versions
      debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_version.stdout_lines }}"
          - "Jenkins active: {{ jenkins_active.stdout }}"
